name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

permissions:
  contents: read

jobs:
  build-and-test:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 配信 (testflight.yml) と同じ Xcode 26 で確かめる。macos-15 の Xcode 16.4 は 2026-11-04 のイメージから
      # opencv2.xcframework.zip の取得が「already exists in file system」で失敗し、キャッシュを消しても直らなかった
      - name: Select Xcode 26
        run: |
          latest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Pick simulator
        id: sim
        run: |
          # iPhone 16 が無いイメージでも動くよう、使える iPhone を選ぶ
          name="$(xcrun simctl list devices available | grep -oE 'iPhone 16 \(' | head -1 | sed 's/ ($//')"
          if [ -z "$name" ]; then
            name="$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)? \(' | head -1 | sed 's/ ($//')"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Simulator: $name"

      - name: Build
        run: |
          xcodebuild \
            -project BodyLapse.xcodeproj \
            -scheme BodyLapse \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            build

      - name: Test
        run: |
          xcodebuild \
            -project BodyLapse.xcodeproj \
            -scheme BodyLapse \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:BodyLapseTests \
            test
