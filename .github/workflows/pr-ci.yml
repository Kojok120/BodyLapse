name: PR CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

permissions:
  contents: read

jobs:
  build-and-test:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 2026-11-04 のランナーイメージから、SwiftPM のバイナリ (opencv2.xcframework.zip) の取得が
      # 「already exists in file system」で失敗するようになった。取得の前にキャッシュを空にする
      - name: Clear SwiftPM caches
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/org.swift.swiftpm

      - name: Build
        run: |
          xcodebuild \
            -project BodyLapse.xcodeproj \
            -scheme BodyLapse \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            build

      - name: Test
        run: |
          xcodebuild \
            -project BodyLapse.xcodeproj \
            -scheme BodyLapse \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:BodyLapseTests \
            test
